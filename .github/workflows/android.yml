name: Android app

# The wrapper carries the phone's own document scanner and its share sheet; the
# screens themselves are loaded from the live site, so this build is needed only
# when the wrapper or the web app's capture path changes. The APK is published
# under one fixed tag, so the download link on the phone never changes.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "src/native-bridge.js"
      - "src/scan.js"
      - "src/export.js"
      - "public/offline.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  # A pull request compiles the wrapper without publishing it.
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "src/native-bridge.js"
      - "src/scan.js"
      - "src/export.js"
      - "public/offline.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check that the signing key is configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::חסר ה-secret בשם ANDROID_KEYSTORE_BASE64 בהגדרות הריפו. בלעדיו אי אפשר לחתום על האפליקציה."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Copy the web build into the wrapper
        run: npx cap sync android
      - name: Accept the Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # The key file itself is the secret. Android requires a password on
          # that file, and it is fixed here so the phone owner keeps exactly one
          # repository secret; the password alone unlocks nothing.
          ANDROID_KEYSTORE_PASSWORD: kiri-store-android
          ANDROID_KEY_ALIAS: kiri
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          cd android && ./gradlew --no-daemon assembleRelease
      - name: Name the file after the version
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/kiri-store.apk
          ls -l artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: kiri-store-apk-${{ github.run_number }}
          path: artifacts/kiri-store.apk
          if-no-files-found: error
          retention-days: 30
      # One tag, one asset: the phone's download link stays the same forever.
      - name: Publish the APK under the fixed download link
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-latest
          VERSION: 1.${{ github.run_number }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          base="https://api.github.com/repos/$GITHUB_REPOSITORY"
          release=$(api "$base/releases/tags/$TAG" || true)
          id=$(printf '%s' "$release" | jq -r '.id // empty')
          body=$(printf 'גרסה %s · נבנתה מ־%s\n\nלהתקנה: לפתוח את הקישור בטלפון אנדרואיד, להוריד את kiri-store.apk ולאשר התקנה.\nהמסכים עצמם נטענים מהאתר החי, כך שעדכוני האפליקציה מגיעים בלי התקנה מחדש.' "$VERSION" "$GITHUB_SHA")
          payload=$(jq -n --arg tag "$TAG" --arg name "אפליקציית אנדרואיד" --arg body "$body" --arg sha "$GITHUB_SHA" \
            '{tag_name:$tag, target_commitish:$sha, name:$name, body:$body, draft:false, prerelease:false}')
          if [ -z "$id" ]; then
            id=$(api -X POST "$base/releases" -d "$payload" | jq -r '.id')
          else
            api -X PATCH "$base/releases/$id" -d "$payload" > /dev/null
            for asset in $(printf '%s' "$release" | jq -r '.assets[]?.id'); do
              api -X DELETE "$base/releases/assets/$asset" > /dev/null
            done
          fi
          curl -sS --fail -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @artifacts/kiri-store.apk \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=kiri-store.apk" > /dev/null
          echo "### האפליקציה נבנתה" >> $GITHUB_STEP_SUMMARY
          echo "גרסה $VERSION · [להורדה בטלפון](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/kiri-store.apk)" >> $GITHUB_STEP_SUMMARY
