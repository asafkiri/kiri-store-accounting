name: App checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: asafkiri/kiri-store-accounting-ai-scan
          ref: main
          path: api-rules-check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          cmp firestore.rules api-rules-check/test/firestore.rules
          cmp storage.rules api-rules-check/test/storage.rules
          cmp src/supplier-name.js api-rules-check/src/supplier-name.js
          cmp src/credit.js api-rules-check/src/credit.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-browser-previews
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 5
